name: Build TaquitoFlix (Android, Android TV, Tizen)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/Moonfin-Client/Moonfin-Core.git
  # La versión de Moonfin que se usa está en el archivo UPSTREAM_REF del repo.
  # La actualiza sola la tarea "Actualizar base de Moonfin".

jobs:
  android:
    name: Android + Android TV (APK)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el código base y aplicar el parche
        run: |
          UPSTREAM_REF=$(tr -d '[:space:]' < UPSTREAM_REF)
          echo "UPSTREAM_REF=$UPSTREAM_REF" >> "$GITHUB_ENV"
          git init -q src && cd src
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          git apply --whitespace=nowarn ../patches/*.patch
          cp -r ../overlay/. .
          # La misma versión de Flutter que usa esa versión de Moonfin.
          FV=$(grep -m1 "FLUTTER_VERSION:" .github/workflows/build.yml | sed "s/.*FLUTTER_VERSION:[[:space:]]*//; s/['\"]//g" | tr -d '[:space:]' || true)
          echo "FLUTTER_VERSION=${FV:-3.47.2}" >> "$GITHUB_ENV"

      - name: Marca TaquitoFlix (textos, iconos y logos)
        working-directory: src
        run: |
          sudo apt-get install -y -qq libcairo2 > /dev/null
          python3 -m pip install --quiet cairosvg pillow
          python3 ../branding/rebrand.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Firma (opcional, con secretos)
        working-directory: src
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Sin keystore: el APK se firma con clave de debug."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=../release.keystore
          storeType=PKCS12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Compilar APKs
        id: apk
        working-directory: src
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD=$(grep '^version:' pubspec.yaml | cut -d'+' -f2 | tr -d '[:space:]')
          TV_VERSION=$(grep '^\s*android_tv_version:' pubspec.yaml | sed 's/.*:[[:space:]]*//' | tr -d '[:space:]')
          TV_BUILD=$(grep '^\s*android_tv_build_number:' pubspec.yaml | sed 's/.*:[[:space:]]*//' | tr -d '[:space:]')
          # Cada compilación lleva un número propio que siempre crece, para que
          # Android acepte la actualización y la app sepa que hay versión nueva.
          RUN=${{ github.run_number }}
          echo "version=${VERSION}.${RUN}" >> "$GITHUB_OUTPUT"
          flutter pub get
          flutter build apk --release --flavor mobile \
            --build-name "${VERSION}.${RUN}" --build-number "$((BUILD + RUN))" \
            --dart-define=DISTRIBUTION_CHANNEL=apk
          flutter build apk --release --flavor androidTv \
            --build-name "${TV_VERSION}.${RUN}" --build-number "$((TV_BUILD + RUN))" \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-mobile-release.apk "../out/TaquitoFlix_Android_v${VERSION}.${RUN}.apk"
          cp build/app/outputs/flutter-apk/app-androidtv-release.apk "../out/TaquitoFlix_AndroidTV_v${TV_VERSION}.${RUN}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  tizen:
    # TaquitoFlix para Samsung se construye sobre la app de tele de Moonfin
    # (Moonfin-Client/Smart-TV, React/Enact): la versión Flutter tardaba más de
    # dos minutos en arrancar en el navegador de la tele.
    name: Samsung Tizen (WGT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar la app de tele de Moonfin y aplicar TaquitoFlix
        run: |
          REF=$(tr -d '[:space:]' < smart-tv/UPSTREAM_REF)
          echo "SMART_TV_REF=$REF" >> "$GITHUB_ENV"
          git init -q tv && cd tv
          git remote add origin https://github.com/Moonfin-Client/Smart-TV.git
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          for p in ../smart-tv/patches/*.patch; do
            [ -e "$p" ] || continue
            git apply --whitespace=nowarn "$p"
          done
          cp -r ../smart-tv/overlay/. .

      - name: Marca TaquitoFlix (nombre, iconos, idioma y servidor)
        run: |
          sudo apt-get install -y -qq libcairo2 > /dev/null
          python3 -m pip install --quiet cairosvg pillow
          # Versión que crece en cada compilación (2.7.N en config.xml).
          RUN=${{ github.run_number }}
          echo "VERSION=2.7.0.${RUN}" >> "$GITHUB_ENV"
          python3 smart-tv/branding/rebrand_tv.py tv "2.7.${RUN}"

      - name: Compilar la app de tele
        working-directory: tv
        env:
          CI: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build:tizen -- --skip-lint
          test -f packages/build-tizen/dist/index.html
          test -f packages/build-tizen/dist/config.xml

      - name: Montar el paquete Tizen
        run: |
          cp -r tv/packages/build-tizen/dist tizen-pkg
          grep -q 'TaquitoFlx.TaquitoFlix' tizen-pkg/config.xml
          mkdir -p out
          (cd tizen-pkg && zip -qr "../out/TaquitoFlix_Tizen_v${VERSION}_sin-firmar.wgt" .)

      - name: Firmar WGT (opcional, con certificado Samsung)
        env:
          TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ -z "$TIZEN_AUTHOR_P12" ] || [ -z "$TIZEN_DISTRIBUTOR_P12" ]; then
            echo "Sin certificados Tizen: se publica solo el WGT sin firmar."
            exit 0
          fi
          LOG="$RUNNER_TEMP/tizen.log"
          : > "$LOG"
          # Si algo falla, el motivo sale como aviso en el resumen de la ejecución.
          CLILOG="$HOME/tizen-studio-data/cli/logs/cli.log"
          fallo() {
            cat "$LOG"
            SRC="$LOG"
            if [ -s "$CLILOG" ]; then
              echo "----- cli.log -----"; tail -n 80 "$CLILOG"
              grep -iE "error|exception|fail|caused" "$CLILOG" | tail -n 25 > "$RUNNER_TEMP/err.txt"
              [ -s "$RUNNER_TEMP/err.txt" ] && SRC="$RUNNER_TEMP/err.txt"
            fi
            MSG=$(tail -c 2500 "$SRC" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=Firma Tizen - $1::$MSG"
            exit 1
          }
          sudo apt-get install -y -qq zip unzip libncurses6 > /dev/null 2>&1 || true
          OK=
          for V in 6.1 5.6 5.5; do
            URL="https://download.tizen.org/sdk/Installer/tizen-studio_${V}/web-cli_Tizen_Studio_${V}_ubuntu-64.bin"
            if curl -fsSL -o tizen-cli.bin "$URL" >> "$LOG" 2>&1; then OK=$V; break; fi
          done
          [ -n "$OK" ] || fallo "descarga del CLI"
          echo "Tizen CLI $OK" | tee -a "$LOG"
          chmod +x tizen-cli.bin
          ./tizen-cli.bin --accept-license "$HOME/tizen-studio" >> "$LOG" 2>&1 || fallo "instalación del CLI $OK"
          TIZEN="$HOME/tizen-studio/tools/ide/bin/tizen"
          [ -x "$TIZEN" ] || { ls -la "$HOME/tizen-studio" "$HOME/tizen-studio/tools" >> "$LOG" 2>&1; fallo "CLI sin ejecutable tizen"; }
          printf '%s' "$TIZEN_AUTHOR_P12" | base64 --decode > "$RUNNER_TEMP/author.p12"
          printf '%s' "$TIZEN_DISTRIBUTOR_P12" | base64 --decode > "$RUNNER_TEMP/distributor.p12"
          "$TIZEN" security-profiles add -n cine -a "$RUNNER_TEMP/author.p12" -p "$TIZEN_AUTHOR_PASSWORD" \
            -d "$RUNNER_TEMP/distributor.p12" -dp "$TIZEN_DISTRIBUTOR_PASSWORD" >> "$LOG" 2>&1 || fallo "perfil de certificados"
          "$TIZEN" cli-config "profiles.path=$HOME/tizen-studio-data/profile/profiles.xml" >> "$LOG" 2>&1 || fallo "configuración del CLI"
          "$TIZEN" security-profiles list >> "$LOG" 2>&1 || true
          # En un servidor sin escritorio el CLI no puede guardar las contraseñas
          # en su almacén cifrado y luego falla con "Invalid password": se
          # escriben directamente en el perfil.
          python3 - "$HOME/tizen-studio-data/profile/profiles.xml" >> "$LOG" 2>&1 <<'PY' || fallo "contraseñas del perfil"
          import os, sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          author = os.environ["TIZEN_AUTHOR_PASSWORD"]
          dist = os.environ["TIZEN_DISTRIBUTOR_PASSWORD"]
          n = 0
          for prof in tree.getroot().iter("profile"):
              if prof.get("name") != "cine":
                  continue
              for item in prof.iter("profileitem"):
                  if not item.get("key"):
                      continue
                  item.set("password", author if item.get("distributor") == "0" else dist)
                  n += 1
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          print(f"Contraseñas escritas en {n} certificados del perfil")
          if n < 2:
              sys.exit(1)
          PY
          : > "$LOG"
          "$TIZEN" package -t wgt -s cine -- "$PWD/tizen-pkg" >> "$LOG" 2>&1 || fallo "empaquetado"
          WGT=$(ls tizen-pkg/*.wgt 2>/dev/null | head -1)
          [ -n "$WGT" ] || fallo "no se generó el .wgt firmado"
          unzip -l "$WGT" | grep -q "author-signature.xml" || fallo "el .wgt no lleva firma de autor"
          unzip -l "$WGT" | grep -q "signature1.xml" || fallo "el .wgt no lleva firma de distribuidor"
          mv "$WGT" "out/TaquitoFlix_Tizen_v${VERSION}.wgt"
          # Firmado correctamente: el WGT sin firmar ya no hace falta.
          rm -f out/*_sin-firmar.wgt
          cat "$LOG"

      - uses: actions/upload-artifact@v4
        with:
          name: tizen
          path: out/*.wgt

  release:
    name: Publicar release
    needs: [android, tizen]
    # Solo main publica: en otras ramas la compilación sirve de prueba.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "UPSTREAM_REF=$(tr -d '[:space:]' < UPSTREAM_REF)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: TaquitoFlix ${{ needs.android.outputs.version }}
          body: |
            APKs para Android y Android TV, y paquete WGT para televisores Samsung (Tizen).
            Basado en Moonfin-Core@${{ env.UPSTREAM_REF }} (GPL-2.0).
          files: dist/*
